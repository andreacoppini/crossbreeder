name: Release

# Builds every platform from the tagged commit and publishes them, so the
# binaries people download are demonstrably built from the tag rather than
# uploaded from somebody's laptop.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Checks out whatever ref triggered this: the tag on a tag push, or the
      # branch it was dispatched from. When dispatched, the release action
      # creates the tag at that commit.
      # fetch-depth: 0 for the tags and history the release-notes guard below
      # needs; a shallow checkout cannot see the previous tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A changelog nobody is forced to write goes stale in two releases. The
      # entry has to exist before the tag can be cut, and this fails the release
      # rather than publishing a version the README does not mention.
      - name: Check the changelog has an entry for this version
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          if ! grep -qF "What's new in ${VERSION} (" README.md; then
            echo "::error::README.md has no changelog entry for ${VERSION}."
            echo "Add a block to the Changelog section before releasing, e.g.:"
            echo
            echo "  What's new in ${VERSION} ($(date -u +%Y-%m-%d)):"
            echo
            echo '  ```'
            echo "  *) component - what changed (#PR);"
            echo '  ```'
            exit 1
          fi
          echo "Changelog entry for ${VERSION} found."

      # The README changelog guard above is not enough on its own: v1.0.7 was
      # published with release notes describing v1.0.6, because docs/RELEASE-NOTES.md
      # is the body of every release and nothing forced it to be updated. It is a
      # cumulative document with no version markers in it, so there is nothing to
      # grep for — what can be checked is that it has been touched since the last
      # release, which is exactly what did not happen.
      - name: Check the release notes have been updated since the last release
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # The tag immediately below this one in version order. Not simply "the
          # newest tag that is not this one": the two agree while releases only
          # go forwards, but the latter picks a *later* tag the moment an older
          # patch release is cut, and compares against the wrong point silently.
          # Sorting this tag in among the others and taking its predecessor is
          # right either way, and does not care whether the tag exists yet.
          PREV="$({ git tag --list 'v*' | grep -vFx "$TAG"; echo "$TAG"; } | sort -V | grep -B1 -Fx "$TAG" | head -1)"
          if [ "$PREV" = "$TAG" ]; then PREV=""; fi
          if [ -z "$PREV" ]; then
            echo "No previous tag; nothing to compare against."
            exit 0
          fi
          if [ -z "$(git log --oneline "${PREV}..HEAD" -- docs/RELEASE-NOTES.md)" ]; then
            echo "::error::docs/RELEASE-NOTES.md has not changed since ${PREV}."
            echo "It is the body of the published release, so shipping it unchanged"
            echo "describes the previous version. Add what this release contains, or"
            echo "note there that nothing user-facing changed."
            exit 1
          fi
          echo "Release notes updated since ${PREV}:"
          git log --oneline "${PREV}..HEAD" -- docs/RELEASE-NOTES.md

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: go.sum

      - name: Test
        run: go test ./...

      # The Windows resources are generated here rather than committed, for two
      # reasons: the version they carry then matches the tag instead of whenever
      # they were last regenerated by hand, and — because they are gitignored —
      # the working tree stays clean, so the binaries report vcs.modified=false.
      # An earlier version of this step rewrote the tracked versioninfo.json in
      # place, which made every binary claim a modified tree and undermined the
      # provenance check the README tells people to run.
      - name: Generate the Windows version resource
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          IFS=. read -r MAJ MIN PAT <<< "${VERSION}"
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.4.1

          # versioninfo.build.json is gitignored; versioninfo.json is not touched.
          jq --arg v "$VERSION" --argjson maj "${MAJ}" --argjson min "${MIN}" --argjson pat "${PAT}" \
            '.FixedFileInfo.FileVersion     = {Major:$maj,Minor:$min,Patch:$pat,Build:0}
           | .FixedFileInfo.ProductVersion  = {Major:$maj,Minor:$min,Patch:$pat,Build:0}
           | .StringFileInfo.FileVersion    = $v
           | .StringFileInfo.ProductVersion = $v' \
            versioninfo.json > versioninfo.build.json

          # -64 alone emits an amd64 COFF object; windows/arm64 needs -arm too,
          # or the link fails with "unknown ARM64 relocation type".
          GVI="$(go env GOPATH)/bin/goversioninfo"
          "$GVI" -64      -o resource_windows_amd64.syso versioninfo.build.json
          "$GVI" -arm -64 -o resource_windows_arm64.syso versioninfo.build.json

          # The tree must be clean here or the binaries will say otherwise.
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::generating the resources dirtied the tree:"
            git status --porcelain
            exit 1
          fi

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "Building ${VERSION}"
          mkdir -p dist
          LDFLAGS="-s -w -X main.version=${VERSION}"

          build() { # os arch ext
            GOOS="$1" GOARCH="$2" go build -trimpath -ldflags "$LDFLAGS" \
              -o "dist/crossbreeder-plus-$1-$2$3" .
          }
          build windows amd64 .exe
          build windows arm64 .exe
          build darwin  amd64 ""
          build darwin  arm64 ""
          build linux   amd64 ""
          build linux   arm64 ""

      - name: Make the macOS universal binary
        run: python3 scripts/make-universal.py
          dist/crossbreeder-plus-darwin-amd64
          dist/crossbreeder-plus-darwin-arm64
          dist/crossbreeder-plus-macos-universal

      - name: Package
        run: |
          set -euo pipefail
          cd dist
          chmod +x crossbreeder-plus-macos-universal crossbreeder-plus-linux-* crossbreeder-plus-darwin-*
          zip -q crossbreeder-plus-macos.zip crossbreeder-plus-macos-universal
          tar czf crossbreeder-plus-linux-amd64.tar.gz crossbreeder-plus-linux-amd64
          tar czf crossbreeder-plus-linux-arm64.tar.gz crossbreeder-plus-linux-arm64
          # The bare .exe is the convenient download, but plenty of corporate
          # proxies and browsers refuse to hand over an executable at all. The
          # zip carries the same file past them; both are published.
          zip -q crossbreeder-plus-windows-amd64.zip crossbreeder-plus-windows-amd64.exe
          zip -q crossbreeder-plus-windows-arm64.zip crossbreeder-plus-windows-arm64.exe
          rm -f crossbreeder-plus-darwin-* crossbreeder-plus-linux-amd64 crossbreeder-plus-linux-arm64
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Crossbreeder Plus ${{ github.event.inputs.tag || github.ref_name }}
          body_path: docs/RELEASE-NOTES.md
          files: dist/*
          fail_on_unmatched_files: true
