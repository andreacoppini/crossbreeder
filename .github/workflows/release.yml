name: Release

# Builds every platform from the tagged commit and publishes them, so the
# binaries people download are demonstrably built from the tag rather than
# uploaded from somebody's laptop.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Checks out whatever ref triggered this: the tag on a tag push, or the
      # branch it was dispatched from. When dispatched, the release action
      # creates the tag at that commit.
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: |
            engine/go.sum
            sensor/go.sum

      - name: Test
        working-directory: engine
        run: go test ./...

      - name: Test the sensor
        working-directory: sensor
        run: go test ./...

      # The Windows resources are generated here rather than committed, for two
      # reasons: the version they carry then matches the tag instead of whenever
      # they were last regenerated by hand, and — because they are gitignored —
      # the working tree stays clean, so the binaries report vcs.modified=false.
      # An earlier version of this step rewrote the tracked versioninfo.json in
      # place, which made every binary claim a modified tree and undermined the
      # provenance check the README tells people to run.
      - name: Generate the Windows version resource
        working-directory: engine
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          IFS=. read -r MAJ MIN PAT <<< "${VERSION}"
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.4.1

          # versioninfo.build.json is gitignored; versioninfo.json is not touched.
          jq --arg v "$VERSION" --argjson maj "${MAJ}" --argjson min "${MIN}" --argjson pat "${PAT}" \
            '.FixedFileInfo.FileVersion     = {Major:$maj,Minor:$min,Patch:$pat,Build:0}
           | .FixedFileInfo.ProductVersion  = {Major:$maj,Minor:$min,Patch:$pat,Build:0}
           | .StringFileInfo.FileVersion    = $v
           | .StringFileInfo.ProductVersion = $v' \
            versioninfo.json > versioninfo.build.json

          # -64 alone emits an amd64 COFF object; windows/arm64 needs -arm too,
          # or the link fails with "unknown ARM64 relocation type".
          GVI="$(go env GOPATH)/bin/goversioninfo"
          "$GVI" -64      -o resource_windows_amd64.syso versioninfo.build.json
          "$GVI" -arm -64 -o resource_windows_arm64.syso versioninfo.build.json

          # The tree must be clean here or the binaries will say otherwise.
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::generating the resources dirtied the tree:"
            git status --porcelain
            exit 1
          fi

      - name: Build
        working-directory: engine
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "Building ${VERSION}"
          mkdir -p ../dist
          LDFLAGS="-s -w -X main.version=${VERSION}"

          build() { # os arch ext
            GOOS="$1" GOARCH="$2" go build -trimpath -ldflags "$LDFLAGS" \
              -o "../dist/crossbreeder-plus-$1-$2$3" .
          }
          build windows amd64 .exe
          build windows arm64 .exe
          build darwin  amd64 ""
          build darwin  arm64 ""
          build linux   amd64 ""
          build linux   arm64 ""

      # The sensor is a Linux appliance, but it builds and runs everywhere, and
      # a macOS or Windows build is what somebody commissioning a site runs
      # from a laptop. The Linux binaries keep their plain names: that is what
      # the installer downloads and what the sensor's own -update looks for.
      - name: Build the sensor
        working-directory: sensor
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          LDFLAGS="-s -w -X main.version=${VERSION}"

          build() { # os arch ext
            GOOS="$1" GOARCH="$2" go build -trimpath -ldflags "$LDFLAGS" \
              -o "../dist/crossbreeder-sensor-$1-$2$3" .
          }
          build linux   amd64 ""
          build linux   arm64 ""
          build linux   arm   ""
          build darwin  arm64 ""
          build windows amd64 .exe

      - name: Make the macOS universal binary
        run: python3 scripts/make-universal.py
          dist/crossbreeder-plus-darwin-amd64
          dist/crossbreeder-plus-darwin-arm64
          dist/crossbreeder-plus-macos-universal

      - name: Package
        run: |
          set -euo pipefail
          cd dist
          chmod +x crossbreeder-plus-macos-universal crossbreeder-plus-linux-* crossbreeder-plus-darwin-*
          zip -q crossbreeder-plus-macos.zip crossbreeder-plus-macos-universal
          tar czf crossbreeder-plus-linux-amd64.tar.gz crossbreeder-plus-linux-amd64
          tar czf crossbreeder-plus-linux-arm64.tar.gz crossbreeder-plus-linux-arm64
          chmod +x crossbreeder-sensor-*
          # The bare .exe is the convenient download, but plenty of corporate
          # proxies and browsers refuse to hand over an executable at all. The
          # zip carries the same file past them; both are published.
          zip -q crossbreeder-plus-windows-amd64.zip crossbreeder-plus-windows-amd64.exe
          zip -q crossbreeder-plus-windows-arm64.zip crossbreeder-plus-windows-arm64.exe
          rm -f crossbreeder-plus-darwin-* crossbreeder-plus-linux-amd64 crossbreeder-plus-linux-arm64
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Crossbreeder Plus ${{ github.event.inputs.tag || github.ref_name }}
          body_path: docs/RELEASE-NOTES.md
          files: dist/*
          fail_on_unmatched_files: true
