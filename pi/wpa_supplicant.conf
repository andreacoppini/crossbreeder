# The Crossbreeder Sensor's radio is driven entirely over the control
# interface: the sensor adds the network it is about to test, joins it, and
# removes it again. Nothing is stored here.
#
# GROUP=netdev is what lets the sensor's unprivileged user reach the socket.
ctrl_interface=DIR=/run/wpa_supplicant GROUP=netdev
update_config=0
ap_scan=1
p2p_disabled=1
